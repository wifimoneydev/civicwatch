name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

# Versions verified against cordova-android 15.1.0
# (framework/cdv-gradle-config-defaults.json + docs):
#   JDK 17, Gradle 8.14.2, Build Tools >= 36.0.0, compile/target SDK 36, min SDK 24.
env:
  NODE_VERSION: '24'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.14.2'
  ANDROID_PLATFORM: 'platforms;android-36'
  ANDROID_BUILD_TOOLS: 'build-tools;36.0.0'
  # SHA-256 of the committed debug signing certificate (signing/civicwatch-debug.p12).
  # Every APK must be signed with it so new builds install over older ones.
  DEBUG_CERT_SHA256: 'cf27be54316fa9c9aa81dd9bbcbc72ff7ef5a3903063e08dd7ce6fc3c89a6cc8'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "platform-tools"

      - name: Install npm dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Write build info (version + commit shown in the app)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          printf "// Generated by GitHub Actions. Identifies the installed build.\nwindow.CIVICWATCH_BUILD = %s;\n" \
            "$(node -e 'console.log(JSON.stringify({version: process.argv[1], commit: process.argv[2], run: process.argv[3], builtAt: new Date().toISOString().slice(0, 16).replace("T", " ") + " UTC"}))' \
            "$VERSION" "${GITHUB_SHA::7}" "$GITHUB_RUN_NUMBER")" > www/js/build-info.js
          cat www/js/build-info.js
          echo "APK_NAME=civicwatch-${VERSION}-${GITHUB_SHA::7}-debug.apk" >> "$GITHUB_ENV"

      - name: Restore Cordova platform and plugins
        run: npx cordova prepare android

      - name: Check Cordova requirements
        run: npx cordova requirements android

      - name: Print toolchain versions
        run: |
          node -v; npm -v
          java -version 2>&1 | head -1
          gradle --version | grep -E '^Gradle'
          npx cordova -v
          npx cordova platform ls
          npx cordova plugin ls
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"

      - name: Build debug APK (signed with the committed debug key)
        run: npx cordova build android --debug --buildConfig build.json

      - name: Verify the APK contains this commit's app and the expected signature
        run: |
          set -euo pipefail
          APK=platforms/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          # The packaged app must be exactly the www/ of this commit.
          for f in index.html js/app.js js/feed-view.js js/report-view.js css/app.css; do
            want=$(sha256sum "www/$f" | cut -d' ' -f1)
            got=$(unzip -p "$APK" "assets/www/$f" | sha256sum | cut -d' ' -f1)
            echo "$f  www=$want  apk=$got"
            test "$want" = "$got"
          done
          unzip -p "$APK" assets/www/js/build-info.js | grep -F "\"commit\":\"${GITHUB_SHA::7}\""
          if unzip -p "$APK" assets/www/index.html | grep -q 'Build diagnostics'; then
            echo "APK still contains the Phase 0 diagnostics page"; exit 1
          fi
          SIGNER=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "signer certificate SHA-256: $SIGNER"
          test "$SIGNER" = "$DEBUG_CERT_SHA256"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | grep -E "^package:" || true

      - name: Rename APK
        run: |
          mkdir -p dist
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: civicwatch-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
